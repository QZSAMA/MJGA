name: Safe text baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/openclaw-proxy/openclaw-proxy-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run pytest -q
      - run: uv run python -m compileall -q config.py limiter.py main.py tests

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/openclaw-proxy/openclaw-proxy-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: projects/openclaw-proxy/openclaw-proxy-go/go.mod
          cache-dependency-path: projects/openclaw-proxy/openclaw-proxy-go/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: docker build -t mjga-openclaw-proxy:test .

  j2me:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mjga-j2me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: sudo apt-get update && sudo apt-get install --yes ant
      - run: cp config.properties.example config.properties
      - run: ant clean test dist
      - name: Verify JAD metadata
        shell: bash
        run: |
          grep -Eq '^MIDlet-Jar-Size: [1-9][0-9]*$' dist/MJGA.jad
          grep -Fxq 'MIDlet-Permissions: javax.microedition.io.Connector.http' dist/MJGA.jad
          grep -Fxq 'MJGA-Api-Url: http://192.168.1.10:8080/v1/chat/completions' dist/MJGA.jad
          grep -Fxq 'MJGA-Client-Token: replace-with-a-long-random-token' dist/MJGA.jad
          grep -Fxq 'MJGA-Model: ark-code-latest' dist/MJGA.jad

  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential-like UUID literals
        shell: bash
        run: |
          if git grep -nE '(API_KEY|CLIENT_TOKEN).*[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}'; then
            echo 'Credential-like literal found in a tracked file.' >&2
            exit 1
          fi
